version: 2
updates:
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
    reviewers:
      - "@getsentry/dev-infra"
      - "@getsentry/security"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: postgres
        versions:
          - ">=15"
      - dependency-name: confluentinc/cp-kafka
        versions:
          - ">=8"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    reviewers:
      - "@getsentry/dev-infra"
      - "@getsentry/security"
